<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <title>本日のレート | 為替レート変換</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 起動画面 -->
  <div id="splashView" class="view splash-view">
    <div class="spinner"></div>
    <p class="splash-text">少々お待ちください</p>
    <p class="splash-subtext" id="splashSubtext">為替データの取得中です。取得完了までしばらくお待ちください</p>
  </div>

  <!-- メイン画面 -->
  <div id="mainView" class="view main-view hidden">
    <header class="main-header">
      <div class="header-titles">
        <h1 class="page-title">本日のレート</h1>
        <p class="rate-timestamp" id="rateTimestamp"></p>
      </div>
      <button id="addButton" class="icon-button" aria-label="通貨を追加">＋</button>
    </header>
    <ul id="currencyList" class="currency-list"></ul>
  </div>

  <!-- 通貨検索/追加画面 -->
  <div id="searchView" class="view search-view hidden">
    <header class="search-header">
      <div class="search-input-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="通貨名またはコード"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
        />
        <button id="closeSearchButton" class="search-clear-button" aria-label="閉じる">×</button>
      </div>
    </header>
    <ul id="searchResults" class="currency-list search-results"></ul>
  </div>

  <div id="toast" class="toast hidden">
    <span class="toast-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </span>
    <span id="toastMessage" class="toast-message"></span>
  </div>

  <script src="currencies.js"></script>
  <script src="app.js"></script>
</body>
</html>
