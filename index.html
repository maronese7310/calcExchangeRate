<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#16213e" />
  <title>本日のレート | 為替レート変換</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 起動画面 -->
  <div id="splashView" class="view splash-view">
    <div class="spinner"></div>
    <p class="splash-text">少々お待ちください</p>
    <p class="splash-subtext" id="splashSubtext">為替データの取得中です。取得完了までしばらくお待ちください</p>
  </div>

  <!-- メイン画面 -->
  <div id="mainView" class="view main-view hidden">
    <header class="main-header">
      <h1 class="page-title">本日のレート</h1>
      <button id="addButton" class="icon-button" aria-label="通貨を追加">＋</button>
    </header>
    <p class="rate-timestamp" id="rateTimestamp"></p>
    <ul id="currencyList" class="currency-list"></ul>
  </div>

  <!-- 通貨検索/追加画面 -->
  <div id="searchView" class="view search-view hidden">
    <header class="search-header">
      <button id="closeSearchButton" class="icon-button" aria-label="閉じる">×</button>
      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="通貨名またはコードで検索"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
      />
    </header>
    <ul id="searchResults" class="currency-list search-results"></ul>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="currencies.js"></script>
  <script src="app.js"></script>
</body>
</html>
